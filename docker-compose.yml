services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/notetakingmern
      JWT_SECRET: change-this-jwt-secret
      CRYPTO_SECRET_KEY: change-this-crypto-secret
      NODE_ENV: development
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:3001/
    depends_on:
      - backend

volumes:
  mongo_data:
